<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <style>
        .cursor-glow-aura {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(147, 51, 234, 0.3) 0%, rgba(99, 102, 241, 0.1) 50%, transparent 70%);
            position: fixed;
            top: 0;
            left: 0;
            border-radius: 50%;
            pointer-events: none;
            z-index: 9997;
            will-change: transform;
        }

        .cursor-shockwave {
            position: fixed;
            border-radius: 50%;
            pointer-events: none;
            transform: translate(-50%, -50%);
            z-index: 9999;
            animation: shockwave-anim 0.8s cubic-bezier(0.165, 0.84, 0.44, 1) forwards;
        }

        @keyframes shockwave-anim {
            0% {
                width: 10px;
                height: 10px;
                background: rgba(147, 51, 234, 0.8);
                box-shadow: 0 0 0 0 rgba(147, 51, 234, 0.8),
                            0 0 0 0 rgba(99, 102, 241, 0.6);
                opacity: 1;
            }
            100% {
                width: 80px;
                height: 80px;
                background: rgba(147, 51, 234, 0);
                box-shadow: 0 0 0 50px rgba(147, 51, 234, 0),
                            0 0 0 100px rgba(99, 102, 241, 0);
                opacity: 0;
            }
        }
    </style>
</head>

<body>
    <canvas id="lineChart" data-avg="80.5"></canvas>
    <canvas id="pieChart" data-completed="5" data-pending="2"></canvas>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const ctxLine = document.getElementById('lineChart');
            const ctxPie = document.getElementById('pieChart');

            Chart.defaults.font.family = "'Outfit', sans-serif";
            Chart.defaults.color = "#64748b";

            new Chart(ctxLine, {
                type: 'line',
                data: {
                    labels: ['M1', 'M2', 'M3', 'M4', 'M5'],
                    datasets: [{
                        label: 'Efficiency',
                        data: [60, 75, 70, 80, parseFloat(ctxLine.dataset.avg)],
                        borderColor: '#6366f1',
                        borderWidth: 4,
                        pointRadius: 4,
                        pointBackgroundColor: '#fff',
                        pointBorderColor: '#6366f1',
                        pointBorderWidth: 2,
                        tension: 0.4,
                        fill: true,
                        backgroundColor: (context) => {
                            const chart = context.chart;
                            const { ctx, chartArea } = chart;
                            if (!chartArea) return null;
                            const gradient = ctx.createLinearGradient(0, chartArea.bottom, 0, chartArea.top);
                            gradient.addColorStop(0, 'rgba(99, 102, 241, 0)');
                            gradient.addColorStop(1, 'rgba(99, 102, 241, 0.15)');
                            return gradient;
                        }
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        y: { grid: { color: '#f1f5f9' }, border: { display: false } },
                        x: { grid: { display: false } }
                    }
                }
            });

            new Chart(ctxPie, {
                type: 'doughnut',
                data: {
                    labels: ['Success', 'Pending'],
                    datasets: [{
                        data: [parseInt(ctxPie.dataset.completed), parseInt(ctxPie.dataset.pending)],
                        backgroundColor: ['#6366f1', '#f1f5f9'],
                        borderWidth: 0,
                        hoverOffset: 12
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: { display: false }
                    },
                    cutout: '80%',
                    animation: { animateRotate: true, animateScale: true }
                }
            });
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        // 1. Fluid Aura Glow around Mouse
        const glow = document.createElement('div');
        glow.className = 'cursor-glow-aura';
        document.body.appendChild(glow);

        let mouseX = window.innerWidth / 2;
        let mouseY = window.innerHeight / 2;
        let glowX = mouseX;
        let glowY = mouseY;
        
        window.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
        }, true);

        function animateGlow() {
            // Fluid interpolation for smooth lagging effect
            glowX += (mouseX - glowX) * 0.12;
            glowY += (mouseY - glowY) * 0.12;
            
            // Offset by half size (200px) to center on cursor
            glow.style.transform = `translate(${glowX - 200}px, ${glowY - 200}px)`;
            requestAnimationFrame(animateGlow);
        }
        animateGlow();

        // 2. Multi-ring Shockwave Ripple on Click
        window.addEventListener('click', (e) => {
            const wave = document.createElement('div');
            wave.className = 'cursor-shockwave';
            
            wave.style.left = e.clientX + 'px';
            wave.style.top = e.clientY + 'px';
            document.body.appendChild(wave);
            
            setTimeout(() => wave.remove(), 800);
        }, true);
    </script>
</body>

</html>
